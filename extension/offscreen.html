<!DOCTYPE html>
<!-- offscreen.html — Chrome MV3: unsichtbares Dokument, in dem die Worker-Hosts
     (Semantik, OCR) leben — Service Worker können keine Worker erzeugen.
     Reihenfolge ist wichtig: offscreen.js setzt YB_STATUS_SINK, bevor
     semantic-host.js seinen Startstatus veröffentlicht (storage ist hier nicht
     verfügbar, der Status geht per runtime.sendMessage an den Service Worker). -->
<html>
<head>
<meta charset="utf-8">
<title>Youtube Blocker — Hosts</title>
</head>
<body>
<script src="offscreen.js"></script>
<script src="semantic-host.js"></script>
<script src="ocr-host.js"></script>
<script src="host-routes.js"></script>
</body>
</html>
